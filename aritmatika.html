<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operator aritmatika</title>
    
</head>
<body>
    <header>
<h1>halaman index</h1>        
        <nav>
            <ul>
                <li><a href="index.html">INDEX</a></li>
                <li><a href="variable.html">BELAJAR VARIABLE</a></li>
            </ul>
        </nav>
    </header>
     <script>

        document.writeln("<h1>Operator Aritmatika</h1>");
        let result = 5 + 3; // Penjumlahan
        document.writeln("<p>5 + 3 = " + result + "</p>");

        let originalResult = result; 

        result = result * 2; // Perkalian
        document.writeln("<p>" + originalResult + " * 2 = " + result + "</p>");
        originalResult = result;
        
        result = result - 4;
        document.writeln("<p>" + originalResult + " - 4 = " + result + "</p>");
        originalResult = result;
     </script>

     <script>
        document.writeln("<h1>Operator argument assaigment</h1>");
        let result2 = 5 + 3; // Penjumlahan
        document.writeln("<p>5 + 3 = " + result2 + "</p>");

        let originalResult2 = result2; 

        result2  *= 2; // Perkalian
        document.writeln("<p>" + originalResult2 + " * 2 = " + result2 + "</p>");
        originalResult2 = result2;
        
        result2 -= 4;
        document.writeln("<p>" + originalResult2 + " - 4 = " + result2 + "</p>");
        originalResult2 = result2;
     </script>
     <script>
        document.writeln("<h1>Operator unery</h1>");
        let result3 = +1;
        document.writeln("<p>" + result3 + "</p>");

        result3--; // 
        document.writeln("<p>" + result3 + "</p>");

        result3++;
        document.writeln("<p>" + result3 + "</p>");
        result3 = -result3;
        document.writeln("<p>" + result3 + "</p>");
     </script>
</body>
</html>
